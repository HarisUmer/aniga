name: aniga

# Production-ish stack for the EC2 box. Only Caddy is published (80/443).
# Postgres and the backend are reachable only on the private Docker network.
services:
  postgres:
    image: postgres:17-alpine
    container_name: aniga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aniga}
      POSTGRES_USER: ${POSTGRES_USER:-aniga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - aniga-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # t3.micro has ~1 GB RAM. Defaults (128 MB buffers, a 4 GB cache hint, 100 connections)
    # reserve memory this box does not have.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aniga} -d ${POSTGRES_DB:-aniga}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: aniga-backend:latest
    container_name: aniga-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aniga}
      DB_USER: ${POSTGRES_USER:-aniga}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set in .env}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?set in .env}
      ANIGA_SESSION_SECRET: ${ANIGA_SESSION_SECRET:?set in .env}
      ANIGA_ADMIN_TOKEN: ${ANIGA_ADMIN_TOKEN:?set in .env}
      # Heap cap stays under the 1 GB of RAM. A 512 MB swap file is the overflow, not a second memory bank.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC"
    mem_limit: 400m
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: aniga-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./download:/srv/download:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    depends_on:
      - backend

volumes:
  aniga-pgdata:
  caddy-data:
  caddy-config:
