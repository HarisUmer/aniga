<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Where a tap on the phone goes</title>
  <desc id="desc">The phone talks only to Caddy over HTTPS. Caddy forwards to Spring Boot. Spring Boot talks to Postgres and, for sign-in only, to Firebase.</desc>
  <rect width="960" height="520" fill="#F6F1E7"/>
  <text x="40" y="42" fill="#221C17" font-family="Georgia, Palatino, serif" font-size="22">Where a tap goes</text>
  <text x="40" y="66" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="13">The phone never calls Firebase. Postgres is not on the internet.</text>

  <rect x="36" y="96" width="200" height="300" rx="3" fill="#F1E9DA" stroke="#221C17" stroke-width="1.5"/>
  <text x="136" y="128" text-anchor="middle" fill="#E5532D" font-family="Georgia, Palatino, serif" font-size="13">PHONE</text>
  <text x="136" y="160" text-anchor="middle" fill="#221C17" font-family="Georgia, Palatino, serif" font-size="18">Aniga</text>
  <text x="56" y="196" fill="#221C17" font-family="Segoe UI, sans-serif" font-size="13">Stores a session token</text>
  <text x="56" y="218" fill="#221C17" font-family="Segoe UI, sans-serif" font-size="13">Sends it as Bearer</text>
  <text x="56" y="250" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">Trusts our CA for this</text>
  <text x="56" y="268" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">host only. Catalog,</text>
  <text x="56" y="286" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">shelf, chat, matches.</text>

  <line x1="236" y1="200" x2="318" y2="200" stroke="#E5532D" stroke-width="1.5"/>
  <polygon points="318,200 308,195 308,205" fill="#E5532D"/>
  <text x="277" y="188" text-anchor="middle" fill="#E5532D" font-family="Segoe UI, sans-serif" font-size="11">HTTPS</text>

  <rect x="320" y="96" width="280" height="88" rx="3" fill="#221C17"/>
  <text x="460" y="128" text-anchor="middle" fill="#F1E9DA" font-family="Georgia, Palatino, serif" font-size="16">Caddy · ports 80 and 443</text>
  <text x="460" y="152" text-anchor="middle" fill="#B9AD9A" font-family="Segoe UI, sans-serif" font-size="12">The only door on the box</text>
  <line x1="460" y1="184" x2="460" y2="214" stroke="#221C17" stroke-width="1.5"/>
  <polygon points="460,214 455,204 465,204" fill="#221C17"/>

  <rect x="320" y="216" width="280" height="110" rx="3" fill="#F1E9DA" stroke="#221C17" stroke-width="1.5"/>
  <text x="460" y="248" text-anchor="middle" fill="#221C17" font-family="Georgia, Palatino, serif" font-size="16">Spring Boot · :8080</text>
  <text x="460" y="272" text-anchor="middle" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">Not published to the host</text>
  <text x="460" y="296" text-anchor="middle" fill="#221C17" font-family="Segoe UI, sans-serif" font-size="12">Checks the session, then the data</text>

  <line x1="460" y1="326" x2="460" y2="356" stroke="#221C17" stroke-width="1.5"/>
  <polygon points="460,356 455,346 465,346" fill="#221C17"/>
  <rect x="320" y="358" width="280" height="78" rx="3" fill="#2F6F52"/>
  <text x="460" y="390" text-anchor="middle" fill="#F6F1E7" font-family="Georgia, Palatino, serif" font-size="16">Postgres</text>
  <text x="460" y="414" text-anchor="middle" fill="#D7E8DF" font-family="Segoe UI, sans-serif" font-size="12">Docker network only · port 5432 closed</text>

  <line x1="600" y1="270" x2="668" y2="200" stroke="#3D6A9E" stroke-width="1.5"/>
  <polygon points="668,200 656,202 662,212" fill="#3D6A9E"/>
  <rect x="670" y="120" width="250" height="120" rx="3" fill="#F1E9DA" stroke="#3D6A9E" stroke-width="1.5"/>
  <text x="795" y="152" text-anchor="middle" fill="#3D6A9E" font-family="Georgia, Palatino, serif" font-size="16">Firebase Auth</text>
  <text x="795" y="180" text-anchor="middle" fill="#221C17" font-family="Segoe UI, sans-serif" font-size="12">Email and password check</text>
  <text x="795" y="202" text-anchor="middle" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">Its token is thrown away</text>
  <text x="795" y="224" text-anchor="middle" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">No shelves, no chat, no scores</text>

  <text x="40" y="470" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">Security group: 22, 80, 443. Nothing else. Secrets live in a file on the server, mode 600, and are not in git.</text>
  <text x="40" y="492" fill="#85796A" font-family="Segoe UI, sans-serif" font-size="12">Port 80 serves the APK. Port 443 is the API, with the certificate the app was built to trust.</text>
</svg>
